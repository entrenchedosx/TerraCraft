name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-devel-2.30.8-VC.zip" -OutFile "$env:GITHUB_WORKSPACE\SDL2.zip"
          Expand-Archive -Path "$env:GITHUB_WORKSPACE\SDL2.zip" -DestinationPath "$env:GITHUB_WORKSPACE"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTERRACRAFT_WERROR=ON "-DSDL2_DIR=${{ github.workspace }}/SDL2-2.30.8/cmake"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgl1-mesa-dev libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTERRACRAFT_WERROR=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake sdl2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTERRACRAFT_WERROR=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
